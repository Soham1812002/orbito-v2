name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend Checks
      - name: Setup Node 20 (backend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend — TypeScript typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend — Build
        working-directory: backend
        run: npm run build

      # Frontend Checks
      - name: Setup Node 20 (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend — TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend — Build
        working-directory: frontend
        run: npm run build
