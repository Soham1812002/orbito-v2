upstream backend_api {
    server backend:9000;
}

# Rate-limit zones (keyed per client IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

gzip on;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml
    application/xml;
gzip_vary on;

server {
    listen 80;
    listen 4173;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Auth login — strict rate limit (Layer 1 edge defense)
    location = /auth/v1/api/auth/login {
        limit_req        zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend_api/v1/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Auth API routes — general API rate limit
    location /auth/v1/api/ {
        limit_req        zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend_api/v1/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Uploaded static files proxy
    location /auth/uploads/ {
        limit_req        zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Vite content-hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA routing fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
